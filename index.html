<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roya Beyond – بطاقة الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fcfb;--ink:#0f3d6e;--teal:#16a085;--mut:#5b7186;--card:#fff;--line:#cfe6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f2e;--ink:#e6f3f6;--teal:#3ddc97;--mut:#93aab8;--card:#12304a;--line:#24506b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.6}
main{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
h1{font-size:26px;font-weight:800;margin:0 0 4px}p.s{margin:0 0 18px;color:var(--mut)}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
label{font-weight:600;font-size:14px;display:grid;gap:4px}
input[type=text]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--teal)}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn{font:inherit;font-weight:800;padding:11px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;background:#f3fcfb}
#msg{min-height:1.5em;color:var(--mut);font-size:14px;margin:8px 0 0}
</style></head><body><main>
<section><h1>بطاقة حضور Roya Beyond</h1><p class="s">اكتب اسمك وارفع صورتك، والبطاقة بتتعمل فورًا.</p>
<form onsubmit="return false">
<label>الاسم<input type="text" id="name" placeholder="Ziad ..." autocomplete="off"></label>
<label>صورتك<input type="file" id="photo" accept="image/*"></label>
<label>تكبير الصورة<input type="range" id="zoom" min="1" max="3" step="0.02" value="1"></label>
<label>تحريك أفقي<input type="range" id="px" min="-1" max="1" step="0.02" value="0"></label>
<label>تحريك رأسي<input type="range" id="py" min="-1" max="1" step="0.02" value="0"></label>
<button class="btn" id="dl" type="button">تحميل البطاقة PNG</button>
</form></section>
<section><canvas id="c" width="1080" height="1080" aria-label="معاينة البطاقة"></canvas><p id="msg"></p></section>
</main>

let ph=null;
function hex(cx,cy,r){x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;x[i?'lineTo':'moveTo'](cx+r*Math.cos(a),cy+r*Math.sin(a))}x.closePath()}
function txt(t,px_,y,size,wt,col,sp){x.font=wt+' '+size+'px Cairo,sans-serif';x.fillStyle=col;x.textAlign='center';x.letterSpacing=(sp||0)+'px';x.fillText(t,px_,y);x.letterSpacing='0px'}
function head(y){
 const A="I'M",B='ATTENDING',sp=8;x.textAlign='left';x.letterSpacing=sp+'px';
 x.font='400 72px Cairo';const wa=x.measureText(A).width;x.font='800 72px Cairo';const wb=x.measureText(B).width;
 const gap=26,tot=wa+gap+wb-sp,x0=540-tot/2;
 x.font='400 72px Cairo';x.fillStyle=NAVY;x.fillText(A,x0,y);
 const g=x.createLinearGradient(x0+wa+gap,0,x0+tot,0);g.addColorStop(0,NAVY);g.addColorStop(1,TEAL);
 x.font='800 72px Cairo';x.fillStyle=g;x.fillText(B,x0+wa+gap,y);x.letterSpacing='0px'}
function circuit(){
 x.save();x.strokeStyle='rgba(22,160,133,.22)';x.fillStyle='#f3fcfb';x.lineWidth=2.5;
 const L=[[[70,330],[70,470],[130,530],[130,640]],[[110,300],[110,400],[170,460]],[[1010,330],[1010,470],[950,530],[950,640]],[[970,300],[970,400],[910,460]]];
 L.forEach(p=>{x.beginPath();p.forEach((q,i)=>x[i?'lineTo':'moveTo'](q[0],q[1]));x.stroke();const e=p[p.length-1];x.beginPath();x.arc(e[0],e[1],7,0,7);x.fill();x.stroke()});
 x.restore()}
function draw(){
 const bg=x.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#f6fdfc');bg.addColorStop(1,'#dff3f0');
 x.fillStyle=bg;x.fillRect(0,0,1080,1080);circuit();
 const fr=x.createLinearGradient(0,0,1080,1080);fr.addColorStop(0,NAVY);fr.addColorStop(1,TEAL);
 x.strokeStyle=fr;x.lineWidth=5;x.strokeRect(30,30,1020,1020);
 x.strokeStyle='rgba(22,160,133,.55)';x.lineWidth=1.5;x.strokeRect(44,44,992,992);
 [[40,40,115],[1040,1040,115]].forEach(([a,b,r])=>{x.save();x.beginPath();x.rect(0,0,1080,1080);x.clip();hex(a,b,r);x.fillStyle=fr;x.fill();hex(a+(a<500?30:-30),b+(b<500?30:-30),r);x.strokeStyle=GRN;x.lineWidth=5;x.stroke();x.restore()});
 [[135,128,24],[945,952,24]].forEach(([a,b,r])=>{hex(a,b,r);x.fillStyle=GRN;x.fill()});
 x.globalCompositeOperation='multiply';if(logo.complete)x.drawImage(logo,540-125,52,250,231);x.globalCompositeOperation='source-over';
 head(372);
 txt('Roya Beyond',540,438,46,'800',NAVY,2);
 const cx=540,cy=668,R=190;
 // road-arrow sweeping behind the photo
 x.save();const rg=x.createLinearGradient(80,860,960,500);rg.addColorStop(0,NAVY);rg.addColorStop(1,GRN);
 x.lineCap='round';x.strokeStyle=rg;x.lineWidth=34;x.beginPath();x.moveTo(70,880);x.bezierCurveTo(250,860,330,560,930,520);x.stroke();
 x.strokeStyle='#f3fcfb';x.lineWidth=3;x.setLineDash([16,16]);x.stroke();x.setLineDash([]);
 x.fillStyle=GRN;x.beginPath();x.moveTo(985,505);x.lineTo(922,468);x.lineTo(930,555);x.closePath();x.fill();x.restore();
 // orbit ring + nodes
 x.save();x.strokeStyle=TEAL;x.lineWidth=3;x.beginPath();x.arc(cx,cy,R+48,Math.PI*0.15,Math.PI*1.55);x.stroke();
 [0.15,0.55,0.95,1.55].forEach(t=>{const a=Math.PI*t;x.beginPath();x.arc(cx+(R+48)*Math.cos(a),cy+(R+48)*Math.sin(a),9,0,7);x.fillStyle='#f3fcfb';x.fill();x.stroke()});x.restore();
 hex(cx+16,cy+12,R);x.fillStyle=TEAL;x.fill();
 x.save();hex(cx,cy,R);x.clip();x.fillStyle='#dcefee';x.fillRect(cx-R,cy-R,2*R,2*R);
 if(ph){const w=2*R,s=Math.max(w/ph.width,w/ph.height)*$('zoom').value,iw=ph.width*s,ih=ph.height*s;
  const ox=(iw-w)/2*$('px').value*-1,oy=(ih-w)/2*$('py').value*-1;x.drawImage(ph,cx-iw/2+ox,cy-ih/2+oy,iw,ih)}
 else txt('+ صورتك',cx,cy+10,34,'600','#7aa6a3');
 x.restore();hex(cx,cy,R);x.strokeStyle=NAVY;x.lineWidth=6;x.stroke();
 const n=$('name').value.trim();let fs=64;x.font='800 '+fs+'px Cairo';while(x.measureText(n||'Your Name').width>880&&fs>28){fs-=2;x.font='800 '+fs+'px Cairo'}
 txt(n||'Your Name',540,930,fs,'800',n?NAVY:'#9bb5b3');
 const ug=x.createLinearGradient(470,0,610,0);ug.addColorStop(0,TEAL);ug.addColorStop(1,GRN);x.fillStyle=ug;x.fillRect(470,946,140,6);
 const d=['كلية الحاسبات والمعلومات','24/10/2026','12:00'];
 if(d.length){let fz=28;const line=d.join('    •    ');x.font='600 '+fz+'px Cairo';while(x.measureText(line).width>880&&fz>18){fz-=1;x.font='600 '+fz+'px Cairo'}txt(line,540,998,fz,'600',NAVY)}
 txt('#RoyaBeyond   #رؤية',540,d.length?1028:1004,22,'400','#6f8a99');
}
['name','zoom','px','py'].forEach(i=>$(i).addEventListener('input',draw));
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{ph=im;draw()};im.src=URL.createObjectURL(f)});
document.fonts.load('800 40px Cairo').then(()=>document.fonts.load('400 40px Cairo')).then(draw).catch(draw);
$('dl').addEventListener('click',()=>{
 cv.toBlob(async b=>{const fn='roya-beyond-'+(($('name').value.trim()||'card').replace(/\s+/g,'-'))+'.png';
  try{const d=await claude.use('downloads');if(d){await d.save({filename:fn,data:b});$('msg').textContent='تم.';return}}catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click();
  $('msg').textContent='لو التحميل ماحصلش: اضغط على الصورة مطولًا واحفظها.'},'image/png')});
draw();
